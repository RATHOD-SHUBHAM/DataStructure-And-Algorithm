  <g id="grid"></g>
  <line x1="40" y1="260" x2="660" y2="260" style="stroke:var(--border-strong)" stroke-width="1"></line>
  <path id="curve" fill="none" style="stroke:var(--text-secondary)" stroke-width="2"></path>
  <g id="steps"></g>
  <g id="root"></g>
</svg>

<div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 16px;min-height:64px;margin-top:8px">
  <div id="msg" style="font-size:15px;line-height:1.5"></div>
</div>

<div style="display:flex;align-items:center;gap:10px;margin-top:12px">
  <button id="prev">Back</button>
  <button id="next">Next step</button>
  <span id="ctr" style="font-size:13px;color:var(--text-secondary)"></span>
</div>

<script>
const X=8, R=[8];
for(let k=0;k<5;k++){const r=R[k];R.push((r+X/r)/2)}
const f=r=>r*r-X;
const px=r=>40+r*(620/9);
const py=y=>260-y*(240/60);
let i=0;
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const grid=document.getElementById('grid');
for(let r=0;r<=9;r++){
  const t=el('text',{x:px(r),y:280,'text-anchor':'middle','font-size':12},grid);
  t.style.fill='var(--text-muted)';t.textContent=r;
}
let d='';
for(let r=0;r<=9.001;r+=0.1){d+=(r===0?'M':'L')+px(r).toFixed(1)+' '+py(f(r)).toFixed(1)+' '}
document.getElementById('curve').setAttribute('d',d);
const root=document.getElementById('root');
el('circle',{cx:px(Math.sqrt(X)),cy:260,r:5},root).style.fill='var(--text-success)';
const rt=el('text',{x:px(Math.sqrt(X)),y:305,'text-anchor':'middle','font-size':12},root);
rt.style.fill='var(--text-success)';rt.textContent='true root 2.83';
const MSG=[
 'Start with a guess r = 8. At this point the curve is far above zero (f = 56), so the guess is too big.',
 'Draw the tangent line at r = 8 and slide down it to the axis. It lands at 4.5, which is the average of 8 and 8/8 = 1.',
 'Repeat at r = 4.5. The tangent lands at about 3.14. The guess nearly halved again.',
 'Now at 3.14 the curve is flatter and closer to zero, so the tangent lands at about 2.84.',
 'One more hop gives 2.8285, correct to four digits. Each step roughly doubles the number of correct digits.'
];
function render(){
  const g=document.getElementById('steps');g.innerHTML='';
  for(let j=0;j<=i;j++){
    const r=R[j],last=(j===i);
    const c=el('circle',{cx:px(r),cy:py(f(r)),r:last?6:4},g);
    c.style.fill=last?'var(--text-warning)':'var(--text-muted)';
    if(j<i){
      const n=R[j+1];
      const ln=el('line',{x1:px(r),y1:py(f(r)),x2:px(n),y2:260,'stroke-width':2},g);
      ln.style.stroke='var(--text-accent)';
      const v=el('line',{x1:px(r),y1:py(f(r)),x2:px(r),y2:260,'stroke-width':1,'stroke-dasharray':'3 3'},g);
      v.style.stroke='var(--border-strong)';
      el('circle',{cx:px(n),cy:260,r:3},g).style.fill='var(--text-accent)';
    }
  }
  const r=R[i];
  document.getElementById('rv').textContent=+r.toFixed(4);
  document.getElementById('fv').textContent=+f(r).toFixed(4);
  document.getElementById('nv').textContent=+((r+X/r)/2).toFixed(4);
  document.getElementById('msg').textContent=MSG[i];
  document.getElementById('ctr').textContent='Step '+(i+1)+' of '+MSG.length;
}
document.getElementById('next').onclick=()=>{if(i<MSG.length-1){i++;render()}};
document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};
render();
</script></div></body></html>
